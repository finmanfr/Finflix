<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finflix</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 20px;
    }

    .row {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
    }

    .card {
      min-width: 200px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.1);
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    /* Video player overlay */
    #player {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    video {
      max-width: 90%;
      max-height: 90%;
    }

    #close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🎬 Finflix</h1>

<div class="row">
  <div class="card" onclick="playVideo('videos/movie1.mp4')">
    <img src="thumbnails/movie1.jpg">
  </div>
</div>

<!-- Video Player -->
<div id="player">
  <span id="close" onclick="closePlayer()">✖</span>
  <video id="video" controls></video>
</div>

<script>
  function playVideo(src) {
    const player = document.getElementById("player");
    const video = document.getElementById("video");

    video.src = src;
    player.style.display = "flex";
    video.play();
  }

  function closePlayer() {
    const player = document.getElementById("player");
    const video = document.getElementById("video");

    video.pause();
    video.src = "";
    player.style.display = "none";
  }
</script>

</body>
</html>
