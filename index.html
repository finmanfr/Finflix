<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Finflix</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }

    #intro-container {
      position: fixed;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
    }

    #main-content {
  display: none;
  height: 100vh;
  background: black;
  color: white;
  padding-bottom: 100px;
}

/* MOVIE ROW */
#movie-row {
  display: flex;
  gap: 16px;
  padding: 20px;
  overflow-x: auto;
}

#movie-row::-webkit-scrollbar {
  display: none;
}

.movie {
  min-width: 140px;
  height: 210px;
  border-radius: 18px;
  background-size: cover;
  background-position: center;
  cursor: pointer;
  transition: transform 0.25s ease;
}

.movie:hover {
  transform: scale(1.08);
}

/* BOTTOM NAV */
#bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  padding: 14px 26px;
  border-radius: 999px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(14px);
}

.nav-btn {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
}

button {
  border-radius: 999px;
  border: none;
  padding: 12px 22px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.15);
  color: white;
  transition: all 0.25s ease;
}

button:hover {
  background: rgba(255,255,255,0.35);
  color: black;
}

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #skip-btn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      padding: 12px 20px;
      font-size: 16px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid white;
      cursor: pointer;
      display: none;
    }

    #skip-btn:hover {
      background: white;
      color: black;
    }

    #unmute-btn {
  position: absolute;
  bottom: 40px;
  left: 40px; /* opposite corner from skip */
  padding: 12px 20px;
  font-size: 16px;
  background: rgba(0,0,0,0.7);
  color: white;
  border: 1px solid white;
  cursor: pointer;
  z-index: 10000;
}

#unmute-btn:hover {
  background: white;
  color: black;
}

  </style>
</head>
<body>

  <!-- INTRO -->
  <div id="intro-container">
    <video id="introVideo" autoplay muted playsinline>
  <source src="intro.mp4" type="video/mp4">
</video>

    <button id="unmute-btn">Unmute</button>
    <button id="skip-btn">Skip Intro</button>
  </div>

  <!-- MAIN SITE (hidden at first) -->
  <div id="main-content">
  <div id="movie-row"></div>

  <div id="bottom-nav">
    <button class="nav-btn">🏠 Home</button>
    <button class="nav-btn">🔍 Search</button>
  </div>
</div>


  <script>
    const skipBtn = document.getElementById("skip-btn");
    const intro = document.getElementById("intro-container");
    const main = document.getElementById("main-content");

    // Show skip after 5 seconds
    setTimeout(() => {
      skipBtn.style.display = "block";
    }, 5000);

    // Skip button click
    skipBtn.onclick = endIntro;

    // When video ends
    video.onended = endIntro;

    function endIntro() {
      intro.style.display = "none";
      main.style.display = "block";
    }
  </script>
<script>
  const skipBtn = document.getElementById("skip-btn");
  const unmuteBtn = document.getElementById("unmute-btn");
  const video = document.getElementById("introVideo");
  const intro = document.getElementById("intro-container");
  const main = document.getElementById("main-content");

  function endIntro() {
    intro.style.display = "none";
    main.style.display = "block";
  }

  // Show skip after 5 seconds
  setTimeout(() => {
    skipBtn.style.display = "block";
  }, 5000);

  // Skip intro
  skipBtn.onclick = endIntro;

  // Unmute button
  unmuteBtn.onclick = () => {
    video.muted = false;
    video.volume = 1;
    video.play();
    unmuteBtn.style.display = "none";
  };

  // When video ends → auto-enter site
  video.onended = endIntro;
</script>


</body>
</html>
