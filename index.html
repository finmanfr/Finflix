<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finflix</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #e50914;
    }

    .row-title {
      margin-left: 20px;
      font-size: 20px;
    }

    .row {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
    }

    .card {
      min-width: 220px;
      cursor: pointer;
      transition: transform 0.25s;
    }

    .card:hover {
      transform: scale(1.15);
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    /* Player Overlay */
    #player {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    video {
      max-width: 90%;
      max-height: 90%;
      background: black;
    }

    #close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 32px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>FINFLIX</header>

<div class="row-title">Trending</div>
<div class="row">

  <div class="card"
    onclick="playVideo('https://drive.google.com/uc?export=download&id=1GFmb9jqDGRZXZPolZtdUp')">
    <img src="thumbnails/K+K.png">
  </div>

</div>

<!-- VIDEO PLAYER -->
<div id="player">
  <div id="close" onclick="closePlayer()">✕</div>
  <video id="video" controls autoplay></video>
</div>

<script>
  function playVideo(src) {
    const player = document.getElementById("player");
    const video = document.getElementById("video");

    video.src = src;
    player.style.display = "flex";
    video.play();
  }

  function closePlayer() {
    const player = document.getElementById("player");
    const video = document.getElementById("video");

    video.pause();
    video.src = "";
    player.style.display = "none";
  }
</script>

</body>
</html>
